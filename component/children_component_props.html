<script src="https://unpkg.com/vue/dist/vue.js"></script>
<script src="https://unpkg.com/vue-router/dist/vue-router.js"></script>

<div id="parent">
    <children message ="test" message-title="props demo" :info="info"></children>
    <h1>one way bind demo</h1>
    <button v-on:click="num-=1">click  minus 1 num:{{num}}</button>
    <children1 :count ="num"></children1>    <h1>one way bind demo</h1>
    <h1>parent and children hold same reference will share change</h1>
    <button v-on:click="arr">change arr[1] = 3 arr:{{arr}}</button>
    <children2 :count ="arr"></children2>
</div>

<script>
    // register
    Vue.component('children', {
        template: '<p><strong>{{messageTitle}}:</strong>parent pass props is {{message}}<br>' +
        '<span>parent info: {{info}}</span></p>',
        props:['message',"messageTitle","info"]
    });
    Vue.component('children1', {
        template: '<button v-on:click="count +=1">click add 1 num: {{count}}</button>',
        props:['count']
    });
    Vue.component('children2', {
        template: '<button v-on:click="count = []">change arr[1] = 1: {{count}}</button>',
        props:['count']
    });
    // create a root instance
    new Vue({
        el: '#parent',
        data:{
            info:'parent data',
            num:1,
            arr:[1,2,3]
        }
    }) // register

    // Now the app has started!
</script>
