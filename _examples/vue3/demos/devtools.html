<script src="https://unpkg.com/vue@next"></script>
<div id="app">
  <button @click="trigger">trigger devtools</button>
</div>
<script>
  const { createApp } = Vue
  const app = createApp({
    methods: {
      trigger() {
        app.config.devtools ^=1;
      }
    }
  })
  app.mount('#app')
</script>
