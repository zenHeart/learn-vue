<script src="https://unpkg.com/vue@2"></script>
<div id="app">
  <h2>函数组件访问 slots 变量</h2>
  <Func>
    <h1>test</h1>
    <h1>demo</h1>
  </Func>
</div>
<script>
  const Func = {
    functional: true,
    render(h, context) {
      console.log('slots', context.slots())
      return h('button', {
      }, [
        context.slots().default,
      ])
    }
  }
  const app = new Vue({
    el: '#app',
    components: { Func },
  })
</script>
