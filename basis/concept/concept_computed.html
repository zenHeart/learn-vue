<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<script src="https://cdn.bootcss.com/vue/2.3.4/vue.js"></script>
</head>
<body>
<div id="app">
    <p >{{arr}}</p>
    <p>{{joinArr}}</p>
</div>

<script>
    var app = new Vue({
        el:"#app",
        data:{
            arr:[1,2,3]
        },
        computed:{
            joinArr:{
                set:function (arr) {
                    this.arr = arr;
                    return arr.join(' ');

                },
                get:function () {
                    return this.arr.join(' ');
                }
            }
        }
    });

</script>
</body>
</html>
