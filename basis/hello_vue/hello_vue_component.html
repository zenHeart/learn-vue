<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<script src="https://cdn.bootcss.com/vue/2.3.4/vue.js"></script>
</head>
<body>
<div id="app">
    <todo-item v-for="item in groceryList" v-bind:todo="item"></todo-item>
</div>
<script>
    Vue.component('todo-item',{
        template:'<li>{{todo.text}}</li>',
        props:['todo']
    });

    var app = new Vue({
        el:"#app",
        data:{
            groceryList:[
                { text: '蔬菜' },
                { text: '奶酪' },
                { text: '随便其他什么人吃的东西' }
            ]
        }
    })
</script>
</body>
</html>
