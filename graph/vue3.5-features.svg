<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42b883"/>
      <stop offset="100%" stop-color="#35495e"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="640" fill="#fafbfc"/>

  <!-- Header -->
  <rect x="0" y="0" width="960" height="92" fill="url(#hero)"/>
  <text x="40" y="44" fill="#fff" font-size="26" font-weight="700">Vue 3.5 新特性一览</text>
  <text x="40" y="72" fill="rgba(255,255,255,0.85)" font-size="14">响应式 · 模板 · API · 性能</text>
  <text x="920" y="72" fill="rgba(255,255,255,0.7)" font-size="12" text-anchor="end">learn-vue · 2026-09</text>

  <!-- Category: Reactive (top-left) -->
  <text x="40" y="130" fill="#35495e" font-size="16" font-weight="700">响应式系统</text>
  <line x1="40" y1="138" x2="280" y2="138" stroke="#42b883" stroke-width="2"/>

  <g filter="url(#card-shadow)">
    <rect x="40" y="150" width="280" height="74" rx="8" fill="#fff" stroke="#e6e8eb"/>
    <text x="56" y="174" fill="#35495e" font-size="14" font-weight="600">响应式 props 解构</text>
    <text x="56" y="194" fill="#5b6b7d" font-size="11">defineProps() 解构后保持响应性</text>
    <text x="56" y="210" fill="#8b97a4" font-size="10">const { count } = defineProps({ count: Number })</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="40" y="234" width="280" height="74" rx="8" fill="#fff" stroke="#e6e8eb"/>
    <text x="56" y="258" fill="#35495e" font-size="14" font-weight="600">watch 默认深度监听</text>
    <text x="56" y="278" fill="#5b6b7d" font-size="11">watch(source, cb) 默认 deep: true</text>
    <text x="56" y="294" fill="#8b97a4" font-size="10">减少常见陷阱，无需显式 deep</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="40" y="318" width="280" height="74" rx="8" fill="#fff" stroke="#e6e8eb"/>
    <text x="56" y="342" fill="#35495e" font-size="14" font-weight="600">useTemplateRef()</text>
    <text x="56" y="362" fill="#5b6b7d" font-size="11">组合式 API 获取模板 ref</text>
    <text x="56" y="378" fill="#8b97a4" font-size="10">替代 ref() + 同名属性约定</text>
  </g>

  <!-- Category: Template (middle) -->
  <text x="340" y="130" fill="#35495e" font-size="16" font-weight="700">模板与编译器</text>
  <line x1="340" y1="138" x2="580" y2="138" stroke="#42b883" stroke-width="2"/>

  <g filter="url(#card-shadow)">
    <rect x="340" y="150" width="280" height="74" rx="8" fill="#fff" stroke="#e6e8eb"/>
    <text x="356" y="174" fill="#35495e" font-size="14" font-weight="600">defineModel 默认值简化</text>
    <text x="356" y="194" fill="#5b6b7d" font-size="11">defineModel() 直接接受 options</text>
    <text x="356" y="210" fill="#8b97a4" font-size="10">无需再写繁琐的 props + emit</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="340" y="234" width="280" height="74" rx="8" fill="#fff" stroke="#e6e8eb"/>
    <text x="356" y="258" fill="#35495e" font-size="14" font-weight="600">延迟激活插槽</text>
    <text x="356" y="278" fill="#5b6b7d" font-size="11">作用域插槽按需执行</text>
    <text x="356" y="294" fill="#8b97a4" font-size="10">父组件访问时再求值,降低无用渲染</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="340" y="318" width="280" height="74" rx="8" fill="#fff" stroke="#e6e8eb"/>
    <text x="356" y="342" fill="#35495e" font-size="14" font-weight="600">更小的产物体积</text>
    <text x="356" y="362" fill="#5b6b7d" font-size="11">重构 reactivity runtime</text>
    <text x="356" y="378" fill="#8b97a4" font-size="10">包体积下降,可树摇粒度更细</text>
  </g>

  <!-- Category: API (right) -->
  <text x="640" y="130" fill="#35495e" font-size="16" font-weight="700">API 与 SSR</text>
  <line x1="640" y1="138" x2="920" y2="138" stroke="#42b883" stroke-width="2"/>

  <g filter="url(#card-shadow)">
    <rect x="640" y="150" width="280" height="74" rx="8" fill="#fff" stroke="#e6e8eb"/>
    <text x="656" y="174" fill="#35495e" font-size="14" font-weight="600">onWatcherCleanup()</text>
    <text x="656" y="194" fill="#5b6b7d" font-size="11">显式注册 watch 清理回调</text>
    <text x="656" y="210" fill="#8b97a4" font-size="10">替代 watchPostEffect 副作用清理</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="640" y="234" width="280" height="74" rx="8" fill="#fff" stroke="#e6e8eb"/>
    <text x="656" y="258" fill="#35495e" font-size="14" font-weight="600">defineProps 解构 + 透传</text>
    <text x="656" y="278" fill="#5b6b7d" font-size="11">更可读的 props 转发</text>
    <text x="656" y="294" fill="#8b97a4" font-size="10">配合 withDefaults 行为一致</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="640" y="318" width="280" height="74" rx="8" fill="#fff" stroke="#e6e8eb"/>
    <text x="656" y="342" fill="#35495e" font-size="14" font-weight="600">useId() / 数据预取</text>
    <text x="656" y="362" fill="#5b6b7d" font-size="11">稳定 ID 生成 + SSR 友好</text>
    <text x="656" y="378" fill="#8b97a4" font-size="10">服务端/客户端 ID 一致</text>
  </g>

  <!-- Bottom: cross-cutting -->
  <rect x="40" y="430" width="880" height="180" rx="12" fill="#fff" stroke="#e6e8eb" filter="url(#card-shadow)"/>
  <text x="60" y="460" fill="#35495e" font-size="16" font-weight="700">性能与稳定性</text>
  <line x1="60" y1="468" x2="280" y2="468" stroke="#42b883" stroke-width="2"/>

  <text x="60" y="498" fill="#35495e" font-size="13" font-weight="600">● 响应式系统体积与运行开销下降</text>
  <text x="60" y="520" fill="#5b6b7d" font-size="11">更细粒度的内部数据结构与按需懒加载,大数组代理性能提升</text>

  <text x="60" y="548" fill="#35495e" font-size="13" font-weight="600">● Hydration 优化</text>
  <text x="60" y="570" fill="#5b6b7d" font-size="11">改进 mismatch 提示,失败时回退 client-only,定位更直观</text>

  <text x="60" y="598" fill="#35495e" font-size="13" font-weight="600">● 类型推导增强</text>
  <text x="60" y="618" fill="#5b6b7d" font-size="11">defineModel / useTemplateRef 的类型由编译器在 IDE 中直接推导</text>

  <text x="920" y="460" fill="#35495e" font-size="13" font-weight="700" text-anchor="end">延伸阅读</text>
  <text x="920" y="482" fill="#5b6b7d" font-size="11" text-anchor="end">github.com/vuejs/core/blob/main/CHANGELOG.md</text>
  <text x="920" y="500" fill="#5b6b7d" font-size="11" text-anchor="end">vuejs.org/guide/extras/reactivity-transform.html</text>
  <text x="920" y="518" fill="#5b6b7d" font-size="11" text-anchor="end">RFC #502 / #493 / #228</text>
</svg>
