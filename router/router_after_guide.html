<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<script src="https://unpkg.com/vue/dist/vue.js"></script>
<script src="https://unpkg.com/vue-router/dist/vue-router.js"></script>

<div id="app">
    <h1>router guide demo</h1>
    <p>
        <router-link to="/foo">Go to Foo</router-link>
        <router-link to="/bar">Go to Bar</router-link>
        <router-link to="/baz">Go to Baz</router-link>
        <router-link to="/foo1">Go to foo1</router-link>
    </p>
    <router-view></router-view>
</div>

<script>
    //申明组件
    const Foo = { template: '<div>foo</div>' }
    const Bar = { template: '<div>bar</div>' }
    const Baz = { template: '<div>baz</div>' }
    //申明路由
    const routes = [
        { path: '/foo', component: Foo },
        { path: '/bar', component: Bar },
        { path: '/baz', component: Baz },
        { path: '/foo1', component: Foo }
    ]
    //实例化路由
    const router = new VueRouter({
        routes,
        beforeEach() {
        }
    })

    //注册全局路由监听钩子
    router.beforeEach((to,from,next) => {
        /**
         * to 即将进入的路由对象,详见 https://router.vuejs.org/zh-cn/api/route-object.html
         * from  正要离开的路由
         * next resolve 方法,切换到下一个绑定的钩子文件
         * */
        console.log('%s switch to %s',from.path,to.path);
        //必须调用 next 才会执行下一个绑定的钩子函数
        next();
    });
    router.beforeEach((to,from,next) => {
        console.log('-----------second callback----------');
        console.log('%s switch to %s',from.path,to.path);
        if(to.path === '/baz') {
            console.log('stop jump to /baz')
            next(false); //该操作或阻止路由切换的所有操作
        } else if(to.path === '/foo') {
            console.log('stop jump to /baz and switch to /baz')
            next('/baz');
        } else {
            next();
        }
    });





    //注册路由
    const app = new Vue({
        router
    }).$mount('#app')


</script>
