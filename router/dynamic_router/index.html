<script src="https://unpkg.com/vue/dist/vue.js"></script>
<script src="https://unpkg.com/vue-router/dist/vue-router.js"></script>

<div id="app">
    <h1>Hello App!</h1>
    <p>
        <!-- use router-link component for navigation. -->
        <!-- specify the link by passing the `to` prop. -->
        <!-- <router-link> will be rendered as an `<a>` tag by default -->
        <router-link to="/foo/1">/foo/1</router-link>
        <router-link to="/foo/2">/foo/2</router-link>
        <router-link to="/foo/3/">/foo/3/</router-link>
        <router-link to="/foo/foo/test">/foo/foo/test</router-link>
        <router-link to="/foo/foo/demo/34">/foo/foo/demo/34</router-link>
    </p>
    <!-- route outlet -->
    <!-- component matched by the route will render here -->
    <router-view></router-view>
</div>

<script>

    const FooList = {
        template: '<div>{{ $route.params }}</div>'

    }


    const routes = [
        {path: '/foo/:id', component: FooList},
        {path: '/foo/:id/demo/:demo', component: FooList},
    ]


    const router = new VueRouter({
        routes
    })

    // 4. Create and mount the root instance.
    // Make sure to inject the router with the router option to make the
    // whole app router-aware.
    const app = new Vue({
        router
    }).$mount('#app')

    // Now the app has started!
</script>
