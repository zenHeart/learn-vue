<script src="https://unpkg.com/vue/dist/vue.js"></script>
<script src="https://unpkg.com/vue-router/dist/vue-router.js"></script>

<div id="app">
    <p>
        <router-link to="/user/foo">/user/foo</router-link>
        <router-link to="/user/foo/profile">/user/foo/profile</router-link>
        <router-link to="/user/foo/posts">/user/foo/posts</router-link>
        <router-link to="/posts">/posts</router-link>
    </p>
    <router-view></router-view>
</div>

<script>
    const User = {
        template: `
    <div class="user">
      <h1>top router</h1>
      <h2>User {{ $route.params}}</h2>
      <router-view></router-view>
    </div>
  `
    }

    const UserHome = {
        template: '<div>children router Home</div>'
    }
    const UserProfile = {template:  '<div>children router Profile</div>'}
    const UserPosts = {template:  '<div>children router Posts</div>'}
    const UserTopPosts =  {template: '<div>top router Posts</div>'}

    const router = new VueRouter({
        routes: [
            {
                path: '/user/:id', component: User,
                children: [
                    // UserHome will be rendered inside User's <router-view>
                    // when /user/:id is matched
                    {path: '', component: UserHome},

                    // UserProfile will be rendered inside User's <router-view>
                    // when /user/:id/profile is matched
                    {path: 'profile', component: UserProfile},

                    // UserPosts will be rendered inside User's <router-view>
                    // when /user/:id/posts is matched
                    {path: 'posts', component: UserPosts},
                    {path: '/posts', component: UserTopPosts}
                ]
            }
        ]
    })

    const app = new Vue({router}).$mount('#app')
</script>
