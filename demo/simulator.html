<div class="device"  id = "charger-{{chargerId}}">
    <div class="device-status" ng-click="inverseFlag()">
        <span class="led" ng-class="getLedStatus(0)" ng-mouseenter="showHint()"></span>
        <span class="led" ng-class="getLedStatus(1)" ></span>
        <p class="device-title mac" ng-bind="meternumber"></p>
        <p class="device-title mac" ng-bind="mac"></p>
        <p class="device-title ip"   ng-bind="ip"></p>
    </div>
    <div class="device-content" ng-hide="hideFlag">
    </div>
</div>
