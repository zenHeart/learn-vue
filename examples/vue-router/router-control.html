<script src="https://unpkg.com/vue/dist/vue.js"></script>
<script src="https://unpkg.com/vue-router/dist/vue-router.js"></script>

<div id="app">
    <h1>路由控制</h1>
    <router-view>
    </router-view>
</div>
<script>
    // 0. If using a module system, call Vue.use(VueRouter)

    // 1. Define route components.
    // These can be imported from other files
    let routerHistory = [];
    const A = {
        template: `<div>
                <h1>主页 A</h1>
            <router-link to="/b">Go to B</router-link></div>
          `
    }
    const B = {
        template: `<div>
    <h1>页面 B</h1>
    <router-link to="/c">Go to C</router-link>
    </div>`
    }
    const C = {
        template: `<div>
            <h1>页面 C</h1>
    <router-link to="/D">D</router-link></div>`
    }
    const D = {
        template: `<div>
            <h1>页面 D</h1>
    <router-link to="/">back</router-link></div>`
    }

    // 2. Define some routes
    // Each route should map to a component. The "component" can
    // either be an actual component constructor created via
    // Vue.extend(), or just a component options object.
    // We'll talk about nested routes later.
    const routes = [{
            path: '/',
            component: A
        },
        {
            path: '/B',
            component: B
        },
        {
            path: '/C',
            component: C
        },
        {
            path: '/D',
            component: D
        }
    ]

    // 3. Create the router instance and pass the `routes` option
    // You can pass in additional options here, but let's
    // keep it simple for now.
    const router = new VueRouter({
        routes,
    })

    router.beforeEach((to, from, next) => {
        console.log('----from,',from,routerHistory)
        next();
    })
    router.afterEach((to, from) => {
        routerHistory.push(from.path)
    })

    // 4. Create and mount the root instance.
    // Make sure to inject the router with the router option to make the
    // whole app router-aware.
    const app = new Vue({
        router
    }).$mount('#app')

    // Now the app has started!
</script>
