<script src="https://unpkg.com/vue/dist/vue.js"></script>

<div id="app">
  <h1>测试指令</h1>
  <input type="text" v-model="text">
  <h1>测试是否换行</h1>

  <p class="container">
    <span class="content" :class="{ellipse:showEllipse}" v-is-ellipse>{{text}}</span>
  </p>
  <span class="expand-icon" v-show="isEllipse" @click="showEllipse^=1">🐍</span>
</div>

<script>
  Vue.directive('isEllipse', function (el, binding, vnode) {
    vnode.context.isEllipse = el.offsetWidth < el.scrollWidth
  })

  const app = new Vue({
    el: "#app",
    data: {
      text: "fsfdsfsffffffffflkddfsdfsdf",
      isEllipse: true,
      showEllipse: true
    }
  });
</script>

<style>
  .container {
    position: relative;
  }

  .content {
    display: inline-block;
    width: 100px;
    overflow-wrap: break-word;
    border: 1px solid #000;
  }

  .ellipse {
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
  }
</style>
