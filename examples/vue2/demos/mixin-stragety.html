tags: [mixin]
---
<script src="https://unpkg.com/vue@2"></script>
<div id="app">
  <h2>验证 mixin 合并策略,默认内部方法覆盖 mixin</h2>
  <button @click="show" >show</button>
</div>
<script>
  const mixin = {
    methods:{
      show:console.log.bind(undefined,'mixin show')
    }
  }
  const app = new Vue({
    el: '#app',
    mixins:[
      mixin
    ],
    methods: {
      show:console.log.bind(undefined,'self show')
    }
  }) 
</script>
