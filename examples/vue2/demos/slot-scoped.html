<script src="https://unpkg.com/vue@2"></script>
<script type="text/x-template" id="container">
<button @click="show^=1">
  trigger
  <slot :show="show"></slot>
</button>
</script>
<script>
  const C1 = {
    template: '#container',
    data() {
      return {
        show: false
      }
    }
  }
</script>
<div id="app">
  <h2>利用 slot-scope 实现父容器访问子元素变量</h2>
  <C1>
    <template v-slot="a">
      {{a}}
    </template>
  </C1>
  <!-- 使用 v-slot:default 效果相同  -->
  <C1>
    <template v-slot:default="a">
      {{a}}
    </template>
  </C1>
</div>
<script>
  const app = new Vue({
    el:'#app',
    components: {
      C1
    }
  })
</script>
