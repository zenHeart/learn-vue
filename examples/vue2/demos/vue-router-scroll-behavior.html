<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue Router scrollBehavior 示例（Vue 2）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    nav { background: #42b983; padding: 1rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    nav a { color: white; text-decoration: none; padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); border-radius: 4px; }
    nav a.router-link-active { background: rgba(255,255,255,0.4); font-weight: bold; }
    .page { padding: 2rem; min-height: 100vh; }
    .page h2 { color: #2c3e50; margin-bottom: 1rem; }
    .page p { line-height: 1.8; color: #666; margin-bottom: 1rem; }
    .section { height: 300px; background: #f5f5f5; margin: 1rem 0; padding: 1rem; border-radius: 8px; }
    .section:nth-child(odd) { background: #e8f5e9; }
    #anchor-demo { scroll-margin-top: 1rem; }
    #anchor1 { background: #e3f2fd; }
    #anchor2 { background: #fce4ec; }
    #anchor3 { background: #fff3e0; }
    .tip { background: #fffde7; padding: 1rem; border-radius: 4px; margin: 1rem 0; border-left: 4px solid #ffc107; }
    .tip code { background: #f5f5f5; padding: 0.2rem 0.4rem; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="app">
    <nav>
      <router-link to="/">首页</router-link>
      <router-link to="/list">列表页（长列表）</router-link>
      <router-link to="/detail">详情页</router-link>
      <router-link to="/detail#anchor-demo">详情页（带锚点）</router-link>
    </nav>
    <router-view></router-view>
  </div>

  <script src="https://unpkg.com/vue@2.7.16/dist/vue.js"></script>
  <script src="https://unpkg.com/vue-router@3.6.5/dist/vue-router.js"></script>
  <script>
    const Home = {
      template: `
        <div class="page">
          <h2>首页</h2>
          <p>scrollBehavior 演示（Vue 2）</p>
          <div class="tip">
            <strong>说明：</strong>本 demo 展示了 Vue Router 2 的滚动行为配置。
            <ul style="margin: 0.5rem 0 0.5rem 1.5rem">
              <li>切换路由时默认回到顶部</li>
              <li>使用 <code>savedPosition</code> 在后退/前进时恢复滚动位置</li>
              <li>支持滚动到指定锚点</li>
            </ul>
            尝试：点击"列表页" → 滚动到中间 → 点击"详情页" → 点击浏览器后退按钮。
          </div>
          <div class="section"><p>首页内容区块 1</p></div>
          <div class="section"><p>首页内容区块 2</p></div>
          <div class="section"><p>首页内容区块 3</p></div>
        </div>
      `
    }

    const List = {
      template: `
        <div class="page">
          <h2>列表页</h2>
          <p>这是一个长列表页面，请向下滚动...</p>
          <div v-for="i in 20" :key="i" class="section">
            <p>列表项 #{{ i }} — 请滚动此页面，然后点击"详情页"，再使用浏览器后退按钮返回。</p>
            <p>如果 <code>savedPosition</code> 配置正确，返回后将恢复到这里 的滚动位置。</p>
          </div>
        </div>
      `
    }

    const Detail = {
      template: `
        <div class="page">
          <h2>详情页</h2>
          <div class="section" id="anchor-demo">
            <h3>锚点区域 #anchor-demo</h3>
            <p>通过 <code>to.hash</code> 配置可以滚动到指定锚点。</p>
          </div>
          <div class="section" id="anchor1"><h3>锚点 1</h3></div>
          <div class="section" id="anchor2"><h3>锚点 2</h3></div>
          <div class="section" id="anchor3"><h3>锚点 3</h3></div>
        </div>
      `
    }

    const routes = [
      { path: '/', component: Home },
      { path: '/list', component: List },
      { path: '/detail', component: Detail }
    ]

    const router = new VueRouter({
      routes,
      scrollBehavior(to, from, savedPosition) {
        if (savedPosition) {
          return savedPosition
        }
        if (to.hash) {
          return { selector: to.hash, behavior: 'smooth' }
        }
        return { x: 0, y: 0 }
      }
    })

    new Vue({
      router
    }).$mount('#app')
  </script>
</body>
</html>
