tags: [ 组件 ]

<script src="https://unpkg.com/vue/dist/vue.js"></script>
<script type="text/x-template" id="children">
  <p>子组件 1</p>
</script>
<script>
  const Children1 = {
    template: "#children"
  }
</script>

<script>
  const Children2 = {
    functional: true,
    render(h) {
      return h('p', '子组件 2')
    }
  }
</script>
<script type="text/x-template" id="children3">
  <p>子组件 3</p>
</script>
<script>
  const Children3 = {
    template: "#children3"
  }
</script>


<div id="app">
  <h1>测试动态组件</h1>
  <p>
    <button @click="componentId='Children1'">children1</button>
    <button @click="componentId='Children2'">children2</button>
    <button @click="componentId='Children3'">children3</button>
  </p>
  <component :is="componentId"></component>
</div>

<script>

  const app = new Vue({
    el: '#app',
    components: {
      Children1,
      Children2,
      Children3
    },
    data: {
      componentId: ""
    },
  });
</script>
