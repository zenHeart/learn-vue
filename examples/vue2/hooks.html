tags: [ hooks ]

<script src="https://cdn.bootcss.com/vue/2.3.4/vue.js"></script>

<script type="text/x-template" id="children">
  <p>Children {{text}}</p>
</script>
<script>
  const Children = {
    template: '#Children',
    beforeCreate() {
      console.log('innner children beforeCreate event!')
    },
    props: {
      text: String
    }
  }
</script>
<script type="text/x-template" id="children">
  <p>Hello hello hello</p>
</script>

<div id="app">
  <Children :text="text" @hook:before-create="show('beforeCreate')" @hook:created="show('created')"
    @hook:before-update="show('beforeUpdate')" @hook:updated="show('updated')" @hook:before-mount="show('beforeMount')"
    @hook:mounted="show('mounted')" @hook:before-destroy="show('beforeDestroy')" @hook:destroyed="show('destroyed')"
    v-if="showChildren"></Children>
  <button @click="triggerChildren">trigger show hide children</button>
  <button @click="updateText">update text</button>
</div>
<script>
  const vue = new Vue({
    el: '#app',
    data: {
      showChildren: true,
      text: ''
    },
    components: {
      Children
    },
    methods: {
      show: console.log,
      triggerChildren() {
        this.showChildren ^= 1;
      },
      updateText() {
        this.text = new Date().toLocaleString();
      }
    }
  })
</script>
