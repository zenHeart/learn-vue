<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<script src="https://cdn.bootcss.com/vue/2.3.4/vue.js"></script>
</head>
<body>
<div id="app">
    <p >{{chargerNumber}}</p>
    <p>{{joinArr}}</p>
</div>

<script>
    var app = new Vue({
        el:"#app",
        data:{
            chargerNumber:[1,2,3]
        },
        computed:{
            joinArr:{
                set:function (chargerNumber) {
                    this.chargerNumber = chargerNumber;
                    return chargerNumber.join(' ');

                },
                get:function () {
                    return this.chargerNumber.join(' ');
                }
            }
        }
    });

</script>
</body>
</html>
