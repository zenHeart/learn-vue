<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.bootcss.com/vue/2.3.4/vue.js"></script>
    <style>
        .error {
            color:red;
        }
        .greenRed {
            background: green;
            color: red;
        }
    </style>
</head>
<body>
<div id="app">
    <p :class="{error:flag}" @click="change">点击改变文本颜色</p>
    <p :class="{greenRed:flag1}" @click="change">点击改变文本颜色</p>
</div>
<script>
    var app = new Vue({
        el:"#app",
        data:{
            flag:false,
            flag1:false
        },
        methods:{
            change:function () {
                this.flag ^= 1;
                this.flag1 ^= 1;
            }
        }
    });

</script>
</body>
</html>
