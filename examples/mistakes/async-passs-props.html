<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<script src="https://unpkg.com/vue/dist/vue.js"></script>
<script src="https://unpkg.com/vue-router/dist/vue-router.js"></script>

<div id="example">
    <h1>异步向属性传入数据,而此时数据并未传入导致子组件钩子中无法获取到值</h1>
    <my-component :name="asyncName">
    </my-component>
    <h1>异步向属性传入数据,利用 v-if 确保数据拉取后渲染子组件</h1>
    <my-component  v-if="isReady" :name="asyncName">
   </my-component>
</div>

<script>
  
    Vue.component('my-component', {
        template:`<h1>{{name}}</h1>`,
        props:{
            name:{
            default:Object,
            required:true
            },
            isReady:false
        },
        created() {
            //由于异步传入此处无法获取到该值
            console.log('props.name:',this.name);
        },
    });

    //2. 实例化 Vue
    new Vue({
        el: '#example',
        data:{
            asyncName:null,
            isReady:false
        },
        created() {
            let self = this;
            //模拟异步拉取数据
            setTimeout(() => {
                self.asyncName = 'test'
                self.isReady = true;//拉取数据成功后才渲染子组件
            },10);
        },
        
    })

</script>
