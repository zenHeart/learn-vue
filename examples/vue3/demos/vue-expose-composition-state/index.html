<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue Composition 状态暴露 - 交互式演示</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
    }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .tab-btn {
      padding: 12px 24px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    
    .tab-btn.active {
      background: white;
      color: #667eea;
    }
    
    .tab-content {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .demo-section {
      margin-bottom: 30px;
    }
    
    .demo-title {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #667eea;
    }
    
    .code-block {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'Fira Code', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.6;
      margin: 15px 0;
    }
    
    .code-block .keyword { color: #569cd6; }
    .code-block .string { color: #ce9178; }
    .code-block .comment { color: #6a9955; }
    .code-block .function { color: #dcdcaa; }
    .code-block .variable { color: #9cdcfe; }
    
    .demo-box {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 20px;
      margin: 15px 0;
    }
    
    .demo-box h4 {
      color: #495057;
      margin-bottom: 15px;
    }
    
    .result-box {
      background: #e7f5ff;
      border: 2px solid #74c0fc;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }
    
    .result-box h5 {
      color: #1864ab;
      margin-bottom: 10px;
    }
    
    .result-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #dee2e6;
    }
    
    .result-item:last-child {
      border-bottom: none;
    }
    
    .result-label {
      color: #495057;
    }
    
    .result-value {
      color: #1864ab;
      font-weight: 600;
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5568d3;
    }
    
    .btn-secondary {
      background: #868e96;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #6c757d;
    }
    
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    /* 子组件样式 */
    .child-component {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border-radius: 12px;
      padding: 20px;
      color: white;
      margin: 15px 0;
    }
    
    .child-component h4 {
      margin-bottom: 15px;
    }
    
    .child-state {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    
    .state-item {
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 8px;
    }
    
    .state-label {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .state-value {
      font-size: 24px;
      font-weight: bold;
    }
    
    /* 对比表格 */
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    
    .comparison-table th,
    .comparison-table td {
      padding: 12px;
      text-align: left;
      border: 1px solid #dee2e6;
    }
    
    .comparison-table th {
      background: #667eea;
      color: white;
    }
    
    .comparison-table tr:nth-child(even) {
      background: #f8f9fa;
    }
    
    /* 流程图 */
    .flow-diagram {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    
    .flow-box {
      padding: 20px 30px;
      border-radius: 12px;
      text-align: center;
      min-width: 150px;
    }
    
    .flow-box.parent {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .flow-box.child {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }
    
    .flow-arrow {
      font-size: 24px;
      color: #667eea;
    }
    
    /* 自测题 */
    .quiz-item {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .quiz-question {
      font-size: 16px;
      color: #333;
      margin-bottom: 15px;
    }
    
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .quiz-option {
      padding: 12px 20px;
      background: white;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .quiz-option:hover {
      border-color: #667eea;
    }
    
    .quiz-option.correct {
      border-color: #51cf66;
      background: #d3f9d8;
    }
    
    .quiz-option.incorrect {
      border-color: #ff6b6b;
      background: #fff5f5;
    }
    
    .quiz-result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    
    .quiz-result.show {
      display: block;
    }
    
    .quiz-result.pass {
      background: #d3f9d8;
      color: #2b8a3e;
    }
    
    .quiz-result.fail {
      background: #fff5f5;
      color: #c92a2a;
    }
    
    .nav-tabs {
      display: flex;
      border-bottom: 2px solid #e9ecef;
      margin-bottom: 20px;
    }
    
    .nav-tab {
      padding: 10px 20px;
      border: none;
      background: none;
      cursor: pointer;
      color: #6c757d;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    
    .nav-tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔓 Vue Composition 状态暴露机制</h1>
    
    <div id="app">
      <div class="tabs">
        <button 
          v-for="(tab, index) in tabs" 
          :key="index"
          :class="['tab-btn', { active: activeTab === index }]"
          @click="activeTab = index"
        >
          {{ tab }}
        </button>
      </div>
      
      <!-- 概念总览 -->
      <div :class="['tab-content', { active: activeTab === 0 }]">
        <div class="demo-section">
          <h3 class="demo-title">📚 核心概念</h3>
          <p>Vue 3 Composition API 的 `<script setup>` 中，组件内部的状态默认是<strong>私有的</strong>，外部无法直接访问。这是 Vue 3 有意设计的「最小暴露」原则。</p>
          
          <div class="flow-diagram">
            <div class="flow-box parent">
              <div>父组件</div>
              <small>ref="childRef"</small>
            </div>
            <div class="flow-arrow">→</div>
            <div class="flow-box child">
              <div>子组件</div>
              <small>defineExpose()</small>
            </div>
          </div>
        </div>
        
        <div class="demo-section">
          <h3 class="demo-title">⚖️ Vue 2 vs Vue 3 对比</h3>
          <table class="comparison-table">
            <thead>
              <tr>
                <th>特性</th>
                <th>Vue 2</th>
                <th>Vue 3 `<script setup>`</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>状态访问</td>
                <td>通过 `this` 直接访问</td>
                <td>需通过 `defineExpose()` 暴露</td>
              </tr>
              <tr>
                <td>暴露方式</td>
                <td>所有 data/props/methods 默认公开</td>
                <td>显式暴露所需内容</td>
              </tr>
              <tr>
                <td>安全性</td>
                <td>较低（可能意外暴露）</td>
                <td>更高（默认私有）</td>
              </tr>
              <tr>
                <td>封装性</td>
                <td>弱</td>
                <td>强</td>
              </tr>
            </tbody>
          </table>
        </div>
        
        <div class="demo-section">
          <h3 class="demo-title">🎯 问题场景</h3>
          <div class="code-block">
<span class="comment">&lt;!-- 子组件 Child.vue --&gt;</span>
<span class="keyword">&lt;script setup&gt;</span>
<span class="keyword">import</span> { ref } from <span class="string">'vue'</span>

<span class="keyword">const</span> <span class="variable">count</span> = <span class="function">ref</span>(<span class="string">0</span>)  <span class="comment">// ❌ 私有状态，外部无法直接访问</span>
<span class="keyword">const</span> <span class="variable">increment</span> = () => <span class="variable">count</span>.<span class="variable">value</span>++
<span class="keyword">&lt;/script&gt;</span>

<span class="comment">&lt;!-- 父组件尝试访问 --&gt;</span>
<span class="variable">childRef</span>.<span class="variable">value</span>.<span class="variable">count</span>  <span class="comment">// ❌ undefined!</span>
<span class="variable">childRef</span>.<span class="variable">value</span>.<span class="variable">increment</span>()  <span class="comment">// ❌ 报错!</span>
          </div>
        </div>
      </div>
      
      <!-- 基础演示 -->
      <div :class="['tab-content', { active: activeTab === 1 }]">
        <div class="demo-section">
          <h3 class="demo-title">🖥️ 交互演示：defineExpose 基本用法</h3>
          
          <div class="demo-box">
            <h4>👶 子组件（Child）</h4>
            <p>子组件通过 <code>defineExpose</code> 暴露 count 和 increment 方法</p>
            
            <div class="child-component">
              <h4>子组件状态</h4>
              <div class="child-state">
                <div class="state-item">
                  <div class="state-label">Count</div>
                  <div class="state-value">{{ childState.count }}</div>
                </div>
                <div class="state-item">
                  <div class="state-label">Name</div>
                  <div class="state-value">{{ childState.name }}</div>
                </div>
              </div>
              <div class="btn-group">
                <button class="btn btn-primary" @click="childIncrement">子组件内部 increment()</button>
                <button class="btn btn-secondary" @click="childSetName">子组件内部 setName()</button>
              </div>
            </div>
          </div>
          
          <div class="demo-box">
            <h4>👨 父组件操作</h4>
            <p>父组件通过 <code>ref</code> 访问子组件暴露的内容</p>
            
            <div class="btn-group">
              <button class="btn btn-primary" @click="parentIncrement">父组件调用 childRef.increment()</button>
              <button class="btn btn-secondary" @click="parentSetName">父组件调用 childRef.setName()</button>
              <button class="btn btn-secondary" @click="parentReadCount">父组件读取 childRef.count</button>
            </div>
          </div>
          
          <div class="result-box">
            <h5>📊 操作日志</h5>
            <div v-for="(log, index) in logs" :key="index" class="result-item">
              <span class="result-label">{{ log.action }}</span>
              <span class="result-value">{{ log.result }}</span>
            </div>
            <p v-if="logs.length === 0" style="color: #868e96; text-align: center; padding: 20px;">
              点击上方按钮查看效果
            </p>
          </div>
        </div>
      </div>
      
      <!-- 解决方案 -->
      <div :class="['tab-content', { active: activeTab === 2 }]">
        <div class="demo-section">
          <h3 class="demo-title">✅ 解决方案：defineExpose()</h3>
          
          <div class="code-block">
<span class="comment">// 子组件 Child.vue</span>
<span class="keyword">&lt;script setup&gt;</span>
<span class="keyword">import</span> { ref, <span class="variable">defineExpose</span> } from <span class="string">'vue'</span>

<span class="keyword">const</span> <span class="variable">count</span> = <span class="function">ref</span>(<span class="string">0</span>)
<span class="keyword">const</span> <span class="variable">name</span> = <span class="function">ref</span>(<span class="string">'Child'</span>)

<span class="keyword">const</span> <span class="variable">increment</span> = () => <span class="variable">count</span>.<span class="variable">value</span>++
<span class="keyword">const</span> <span class="variable">setName</span> = (newName) => { <span class="variable">name</span>.<span class="variable">value</span> = newName }

<span class="comment">// 暴露给父组件</span>
<span class="function">defineExpose</span>({
  <span class="variable">count</span>,      <span class="comment">// 暴露响应式 ref</span>
  <span class="variable">name</span>,       <span class="comment">// 暴露响应式 ref</span>
  <span class="variable">increment</span>,  <span class="comment">// 暴露方法</span>
  <span class="variable">setName</span>    <span class="comment">// 暴露方法</span>
})
<span class="keyword">&lt;/script&gt;</span>
          </div>
          
          <div class="code-block">
<span class="comment">// 父组件 Parent.vue</span>
<span class="keyword">&lt;script setup&gt;</span>
<span class="keyword">import</span> { ref } from <span class="string">'vue'</span>
<span class="keyword">import</span> Child from <span class="string">'./Child.vue'</span>

<span class="keyword">const</span> <span class="variable">childRef</span> = <span class="function">ref</span>(<span class="keyword">null</span>)

<span class="keyword">const</span> <span class="variable">handleClick</span> = () => {
  <span class="comment">// 通过 ref 访问子组件暴露的属性和方法</span>
  <span class="variable">console</span>.<span class="function">log</span>(<span class="variable">childRef</span>.<span class="variable">value</span>.<span class="variable">count</span>)  <span class="comment">// ✅ 0</span>
  <span class="variable">childRef</span>.<span class="variable">value</span>.<span class="function">increment</span>()          <span class="comment">// ✅ count = 1</span>
  <span class="variable">childRef</span>.<span class="variable">value</span>.<span class="function">setName</span>(<span class="string">'New Name'</span>)  <span class="comment">// ✅ name = 'New Name'</span>
}
<span class="keyword">&lt;/script&gt;</span>

<span class="keyword">&lt;template&gt;</span>
  <span class="tag">&lt;Child</span> <span class="attr">ref</span>=<span class="string">"childRef"</span> <span class="tag">/&gt;</span>
  <span class="tag">&lt;button</span> <span class="attr">@click</span>=<span class="string">"handleClick"</span><span class="tag">&gt;</span>操作子组件<span class="tag">&lt;/button&gt;</span>
<span class="keyword">&lt;/template&gt;</span>
          </div>
        </div>
        
        <div class="demo-section">
          <h3 class="demo-title">🔄 defineExpose vs expose()</h3>
          
          <table class="comparison-table">
            <thead>
              <tr>
                <th>特性</th>
                <th>defineExpose()</th>
                <th>expose()</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>使用场景</td>
                <td>`<script setup>`</td>
                <td>Options API 或非 setup 组件</td>
              </tr>
              <tr>
                <td>调用方式</td>
                <td>编译器宏，直接调用</td>
                <td>选项对象中定义</td>
              </tr>
              <tr>
                <td>类型推断</td>
                <td>自动推断类型</td>
                <td>需要手动声明</td>
              </tr>
            </tbody>
          </table>
          
          <div class="code-block">
<span class="comment">// expose() - Options API 用法</span>
<span class="keyword">export default</span> {
  <span class="variable">data</span>() {
    <span class="keyword">return</span> { <span class="variable">count</span>: <span class="string">0</span> }
  },
  <span class="variable">methods</span>: {
    <span class="function">increment</span>() { <span class="keyword">this</span>.<span class="variable">count</span>++ }
  },
  <span class="variable">expose</span>: [<span class="string">'count'</span>, <span class="string">'increment'</span>]  <span class="comment">// 暴露特定属性</span>
}
          </div>
        </div>
      </div>
      
      <!-- 最佳实践 -->
      <div :class="['tab-content', { active: activeTab === 3 }]">
        <div class="demo-section">
          <h3 class="demo-title">🎯 最佳实践</h3>
          
          <div class="demo-box">
            <h4>1. 最小暴露原则</h4>
            <div class="code-block">
<span class="comment">// ✅ 推荐：暴露业务接口</span>
<span class="function">defineExpose</span>({
  <span class="variable">getData</span>,      <span class="comment">// ✅ 获取数据</span>
  <span class="variable">setData</span>,      <span class="comment">// ✅ 设置数据</span>
  <span class="variable">validate</span>,     <span class="comment">// ✅ 验证</span>
  <span class="variable">reset</span>         <span class="comment">// ✅ 重置</span>
})

<span class="comment">// ❌ 避免：暴露内部状态</span>
<span class="function">defineExpose</span>({
  <span class="variable">internalState</span>,    <span class="comment">// ❌ 不要暴露内部状态</span>
  <span class="variable">rawData</span>,          <span class="comment">// ❌ 不要暴露原始数据</span>
  <span class="variable">helperFunction</span>    <span class="comment">// ❌ 不要暴露内部工具函数</span>
})
            </div>
          </div>
          
          <div class="demo-box">
            <h4>2. TypeScript 类型安全</h4>
            <div class="code-block">
<span class="comment">// types/form.ts</span>
<span class="keyword">import</span> type { Ref } from <span class="string">'vue'</span>

<span class="keyword">export interface</span> <span class="type">FormExpose</span> {
  <span class="variable">count</span>: Readonly&lt;Ref&lt;<span class="type">number</span>&gt;&gt;
  <span class="variable">name</span>: <span class="type">string</span>
  <span class="variable">increment</span>: () =&gt; <span class="type">void</span>
  <span class="variable">setName</span>: (<span class="attr">name</span>: <span class="type">string</span>) =&gt; <span class="type">void</span>
}

<span class="comment">// 子组件</span>
<span class="keyword">&lt;script setup lang="ts"&gt;</span>
<span class="keyword">import</span> { ref, defineExpose } from <span class="string">'vue'</span>
<span class="keyword">import</span> type { FormExpose } from <span class="string">'../types/form'</span>

<span class="keyword">const</span> <span class="variable">count</span> = <span class="function">ref</span>(<span class="string">0</span>)

<span class="function">defineExpose</span>&lt;<span class="type">FormExpose</span>&gt;({
  <span class="variable">count</span>,
  <span class="variable">name</span>: <span class="string">'Form'</span>,
  <span class="variable">increment</span>: () => <span class="variable">count</span>.<span class="variable">value</span>++,
  <span class="variable">setName</span>: (<span class="attr">newName</span>: <span class="type">string</span>) => { <span class="comment">/* ... */</span> }
})
<span class="keyword">&lt;/script&gt;</span>
            </div>
          </div>
          
          <div class="demo-box">
            <h4>3. 条件暴露</h4>
            <div class="code-block">
<span class="keyword">const</span> <span class="variable">isAdmin</span> = <span class="function">ref</span>(<span class="keyword">false</span>)
<span class="keyword">const</span> <span class="variable">secretData</span> = <span class="function">ref</span>(<span class="string">'仅管理员可见'</span>)

<span class="comment">// 根据条件暴露不同内容</span>
<span class="function">defineExpose</span>({
  <span class="comment">// 所有人都能看到</span>
  <span class="variable">username</span>: <span class="string">'User'</span>,
  <span class="comment">// 仅管理员可见</span>
  ...(<span class="variable">isAdmin</span>.<span class="variable">value</span> && { <span class="variable">secretData</span> })
})
            </div>
          </div>
          
          <div class="demo-box">
            <h4>4. v-model vs defineExpose</h4>
            <table class="comparison-table">
              <thead>
                <tr>
                  <th>场景</th>
                  <th>推荐方案</th>
                  <th>说明</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>表单输入</td>
                  <td>v-model</td>
                  <td>双向绑定，适合数据输入</td>
                </tr>
                <tr>
                  <td>命令式调用</td>
                  <td>defineExpose</td>
                  <td>调用方法，获取数据</td>
                </tr>
                <tr>
                  <td>暴露状态</td>
                  <td>defineExpose</td>
                  <td>只读或命令式修改</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      
      <!-- 自测题 -->
      <div :class="['tab-content', { active: activeTab === 4 }]">
        <div class="demo-section">
          <h3 class="demo-title">📝 自测题</h3>
          
          <div v-for="(quiz, qIndex) in quizzes" :key="qIndex" class="quiz-item">
            <div class="quiz-question">
              <strong>Q{{ qIndex + 1 }}:</strong> {{ quiz.question }}
            </div>
            <div class="quiz-options">
              <div 
                v-for="(option, oIndex) in quiz.options" 
                :key="oIndex"
                :class="['quiz-option', getOptionClass(qIndex, oIndex)]"
                @click="checkAnswer(qIndex, oIndex)"
              >
                {{ option }}
              </div>
            </div>
            <div :class="['quiz-result', { show: quiz.answered }]">
              {{ quiz.answered ? (quiz.correct ? '✅ 回答正确!' : '❌ 回答错误') : '' }}
            </div>
          </div>
          
          <div class="result-box">
            <h5>📊 测试结果</h5>
            <div class="result-item">
              <span class="result-label">正确率</span>
              <span class="result-value">{{ correctCount }} / {{ quizzes.length }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const { createApp, ref, computed } = Vue
    
    createApp({
      setup() {
        // Tab 控制
        const tabs = ['概念总览', '基础演示', '解决方案', '最佳实践', '自测题']
        const activeTab = ref(0)
        
        // 子组件状态模拟
        const childState = ref({
          count: 0,
          name: 'Child'
        })
        
        const childIncrement = () => {
          childState.value.count++
          addLog('子组件内部调用', `increment() → count = ${childState.value.count}`)
        }
        
        const childSetName = () => {
          childState.value.name = 'Renamed-' + Date.now().toString().slice(-4)
          addLog('子组件内部调用', `setName() → name = "${childState.value.name}"`)
        }
        
        // 父组件操作
        const parentIncrement = () => {
          // 模拟通过 ref 访问子组件
          if (childRefAccessible.value) {
            childState.value.count++
            addLog('父组件 ref 调用', `childRef.increment() → count = ${childState.value.count}`)
          }
        }
        
        const parentSetName = () => {
          if (childRefAccessible.value) {
            childState.value.name = 'Parent-' + Date.now().toString().slice(-4)
            addLog('父组件 ref 调用', `childRef.setName() → name = "${childState.value.name}"`)
          }
        }
        
        const parentReadCount = () => {
          if (childRefAccessible.value) {
            addLog('父组件 ref 读取', `childRef.count = ${childState.value.count}`)
          }
        }
        
        const childRefAccessible = ref(true)
        
        // 日志
        const logs = ref([])
        const addLog = (action, result) => {
          logs.value.unshift({ action, result })
          if (logs.value.length > 10) logs.value.pop()
        }
        
        // 自测题
        const quizzes = ref([
          {
            question: 'Vue 3 `<script setup>` 中，子组件内部定义的 ref 默认能否被父组件直接访问？',
            options: ['A. 可以，ref 默认是公开的', 'B. 不可以，需要通过 defineExpose() 暴露', 'C. 可以，但只能读不能写', 'D. 取决于是否为 reactive'],
            correct: 1,
            answered: false,
            selected: null
          },
          {
            question: 'defineExpose() 和 expose() 有什么区别？',
            options: ['A. 没有区别，是同一个函数', 'B. defineExpose() 用于 `<script setup>`，expose() 用于 Options API', 'C. expose() 用于 `<script setup>`，defineExpose() 用于 Options API', 'D. 两者都只能暴露方法，不能暴露数据'],
            correct: 1,
            answered: false,
            selected: null
          },
          {
            question: '以下哪个是 defineExpose() 的正确用法？',
            options: [
              'A. expose({ count, increment })',
              'B. defineExpose({ count, increment })',
              'C. this.expose({ count, increment })',
              'D. exports({ count, increment })'
            ],
            correct: 1,
            answered: false,
            selected: null
          },
          {
            question: '为什么推荐只暴露必要的属性和方法，而不是暴露所有内部状态？',
            options: [
              'A. 性能考虑',
              'B. 封装性考虑，减少耦合',
              'C. 安全性考虑',
              'D. B 和 C 都是'
            ],
            correct: 3,
            answered: false,
            selected: null
          },
          {
            question: 'v-model 和 defineExpose() 分别适合什么场景？',
            options: [
              'A. v-model 用于方法调用，defineExpose 用于表单输入',
              'B. v-model 用于双向绑定（表单输入），defineExpose 用于命令式调用（获取数据/调用方法）',
              'C. 两者可以互换使用',
              'D. defineExpose 用于双向绑定，v-model 用于方法调用'
            ],
            correct: 1,
            answered: false,
            selected: null
          }
        ])
        
        const correctCount = computed(() => {
          return quizzes.value.filter(q => q.correct).length
        })
        
        const getOptionClass = (qIndex, oIndex) => {
          const quiz = quizzes.value[qIndex]
          if (!quiz.answered) return ''
          if (oIndex === quiz.correct) return 'correct'
          if (oIndex === quiz.selected && oIndex !== quiz.correct) return 'incorrect'
          return ''
        }
        
        const checkAnswer = (qIndex, oIndex) => {
          const quiz = quizzes.value[qIndex]
          if (quiz.answered) return
          quiz.selected = oIndex
          quiz.answered = true
        }
        
        return {
          tabs,
          activeTab,
          childState,
          childIncrement,
          childSetName,
          parentIncrement,
          parentSetName,
          parentReadCount,
          childRefAccessible,
          logs,
          quizzes,
          correctCount,
          getOptionClass,
          checkAnswer
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
