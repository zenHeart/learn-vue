<script src="https://unpkg.com/vue@next"></script>
<script type="text/x-template" id="container">
<button @click="show^=1">
  trigger
  <slot :show="show"></slot>
</button>
</script>
<script>
  const C1 = {
    template: '#container',
    data() {
      return {
        show: false
      }
    }
  }
</script>
<div id="app">
  <h2>作用域插槽支持解构语法替换变量名</h2>
  <C1>
    <template v-slot="{show}">
      show: {{show}}
    </template>
  </C1>
  <!-- 使用 v-slot:default 效果相同  -->
  <C1>
    <template v-slot:default="{show}">
      show:{{show}}
    </template>
  </C1>
  <!-- 解构支持替换变量名  -->
  <C1>
    <template v-slot:default="{ show:a }">
      show a:{{a}}
    </template>
  </C1>
</div>
<script>
  const { createApp } = Vue
  const app = createApp({
    components: {
      C1
    }
  }).mount('#app')
</script>
