<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<script src="https://cdn.bootcss.com/vue/2.6.11/vue.js"></script>
</head>
<body>
<h1>验证 v-for 的绑定</h1>
<div id="app">
    <p v-for="item in items" @click="show">
        {{item.text}}
    </p>
    <Hi :text="item.text" :key="index"  v-for="(item,index) in items" @click="show"></Hi>
</div>
<script>

Vue.component('Hi',{
    template:`<h3>{{text}}</h3>`,
    props:{
        text:String
    }
})
    var app = new Vue({
        el:"#app",
        data:{
            items:[{
                text:'h1'
            },{
                text:'h2'
            },{
                text:'h3'
            }]
        },
        methods:{
            show:console.log
        }
    })

    
</script>
</body>
</html>
