<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<script src="https://cdn.bootcss.com/vue/2.3.4/vue.js"></script>
</head>
<body>
<div id="app">
    <p v-bind:title="message">
        鼠标悬停几秒钟查看此处动态绑定的提示信息！
    </p>
</div>
<script>
    var app = new Vue({
        el:"#app",
        data:{
            message:'页面加载于' + new Date()
        }
    })
</script>
</body>
</html>
